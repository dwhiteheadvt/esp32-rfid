; PlatformIO Project Configuration File

[platformio]
default_envs = 
    wifi
    wifi-debug
    wifi-APWIKOGER
    wifi-APWIKOGER-debug
    ethernet-DTWONDER
    ethernet-DTWONDER-debug
    ethernet-DTWONDER-16M
    ethernet-DTWONDER-16M-debug
    ethernet-LILYGO
    ethernet-LILYGO-debug

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
f_cpu = 240000000L
framework = arduino
board = esp32dev
flash_mode = dio
lib_compat_mode = strict

; Force LittleFS System-Wide
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

build_flags = 
    -DCONFIG_FREERTOS_ENABLE_BACKWARD_COMPATIBILITY
    -Wno-deprecated-declarations
build_src_flags = 
upload_speed = 921600
monitor_speed = 115200

lib_deps = 
    esp32async/AsyncTCP @ ^3.5.0
    elims/PsychicMqttClient @ ^0.2.4
    bblanchon/ArduinoJson @ ^7.0.4
    miguelbalboa/MFRC522 @ ^1.4.11
    thomasfredericks/Bounce2 @ ^2.72
    paulstoffregen/Time @ ^1.6.1
    https://github.com/me-no-dev/ESPAsyncWebServer.git

lib_ignore = ESPAsyncTCP

[env:wifi]
board_build.f_cpu = ${common.f_cpu}
platform = ${common.platform}
framework = ${common.framework}
board = ${common.board}
lib_deps = ${common.lib_deps}

board_build.filesystem = littlefs
board_build.partitions = partitions.csv
; extra_scripts = scripts/WIFIdeploy.py

build_flags = 
    ${common.build_flags}

build_src_flags = ${common.build_src_flags}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
board_build.flash_mode = ${common.flash_mode}

[env:wifi-debug]
board_build.f_cpu = ${common.f_cpu}
platform = ${common.platform}
framework = ${common.framework}
board = ${common.board}
lib_deps = ${common.lib_deps}
board_build.filesystem = littlefs
board_build.partitions = ${common.board_build.partitions}
; extra_scripts = scripts/WIFIDBGdeploy.py

build_flags = 
    ${common.build_flags}
    -DGENERIC
    -DDEBUG
build_src_flags = ${common.build_src_flags}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
board_build.flash_mode = ${common.flash_mode}

